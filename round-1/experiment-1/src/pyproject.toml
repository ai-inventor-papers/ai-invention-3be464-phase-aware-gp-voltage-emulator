[project]
name = "phase-aware-gp-voltage-emulator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandapower==3.5.6",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"